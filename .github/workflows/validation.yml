name: Validate Holy Sheet
on:
  pull_request:
  push:
    branches: [main, integration/holy-next50-20261027]
permissions:
  contents: read
jobs:
  collaboration-experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: experiments/collaboration/package-lock.json
      - run: npm ci --ignore-scripts --prefix experiments/collaboration
      - run: npm test --prefix experiments/collaboration
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-bookworm@sha256:bbf83594798e144bff365a9c191c5d779f181fb3135902064ab8ff11918020fc
        env:
          POSTGRES_DB: holy_sheet_acceptance
          POSTGRES_USER: holy_sheet_acceptance
          POSTGRES_PASSWORD: ephemeral-ci-acceptance-only
        ports:
          - 55493:5432
        options: >-
          --health-cmd "pg_isready -U holy_sheet_acceptance -d holy_sheet_acceptance"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      HS_TEST_POSTGRES_URL: postgresql://holy_sheet_acceptance:ephemeral-ci-acceptance-only@127.0.0.1:55493/holy_sheet_acceptance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test -- --reporter=default --reporter=junit --outputFile.junit=artifacts/unit.xml
      - name: Rehearse synthetic PostgreSQL backup and restore
        run: |
          docker exec ${{ job.services.postgres.id }} pg_dump --username holy_sheet_acceptance --dbname holy_sheet_acceptance --format custom > /tmp/holy-sheet-acceptance.dump
          docker exec ${{ job.services.postgres.id }} createdb --username holy_sheet_acceptance holy_sheet_restore_acceptance
          docker exec -i ${{ job.services.postgres.id }} pg_restore --username holy_sheet_acceptance --dbname holy_sheet_restore_acceptance --no-owner --no-privileges < /tmp/holy-sheet-acceptance.dump
          node --import tsx scripts/verify-postgres-restore.mts > artifacts/postgres-restore.json
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Pack the tested shared editor
        run: npm pack --workspace packages/editor --pack-destination artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-results
          path: |
            artifacts/unit.xml
            artifacts/*.tgz
            artifacts/postgres-restore.json
          if-no-files-found: ignore

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HS_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HS_CANDIDATE_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build exact candidate image
        run: docker build --label org.opencontainers.image.revision=${{ env.HS_CANDIDATE_SHA }} --tag holy-sheet-candidate:${{ env.HS_CANDIDATE_SHA }} .
      - name: Verify the isolated import parser ships in the exact image
        run: |
          mkdir -p artifacts
          printf 'Isolated import image canary' | docker run --rm --interactive --read-only --cap-drop ALL --security-opt no-new-privileges --pids-limit 30 --memory 384m --network none --entrypoint node holy-sheet-candidate:${{ env.HS_CANDIDATE_SHA }} --max-old-space-size=256 --disallow-code-generation-from-strings --permission --allow-fs-read=/app/scripts/dist/import-document-worker.cjs /app/scripts/dist/import-document-worker.cjs txt > artifacts/import-image-canary.json
          node --input-type=module -e "import {readFileSync} from 'node:fs';import assert from 'node:assert/strict';const data=JSON.parse(readFileSync('artifacts/import-image-canary.json','utf8'));assert.equal(data.result.document.content[0].content[0].text,'Isolated import image canary');assert.equal(data.result.blocks,1);"
      - name: Qualify disabled and enabled editor boundaries
        run: |
          mkdir -p artifacts
          for editor in 0 1; do
            docker run --detach --name hs-container-check --read-only --cap-drop ALL --security-opt no-new-privileges --pids-limit 100 --memory 512m --tmpfs /tmp:rw,noexec,nosuid,size=64m --publish 127.0.0.1:53104:3000 --env HS_LOCAL_PREVIEW=0 --env HS_RICH_EDITOR_ENABLED=$editor --env HS_OIDC_ENABLED=0 --env HS_ORIGIN=https://staging.holysheet.aplyd.org --env HS_IDENTITY_ISSUER=https://identity.example.invalid --env HS_IDENTITY_JWKS_URL=https://identity.example.invalid/jwks holy-sheet-candidate:${{ env.HS_CANDIDATE_SHA }}
            for attempt in $(seq 1 30); do
              if curl --fail --silent http://127.0.0.1:53104/ > /dev/null; then break; fi
              sleep 1
            done
            node scripts/verify-rollout-boundaries.mjs http://127.0.0.1:53104 --require-framing --picker > artifacts/container-boundaries-$editor.json
            docker inspect --format '{{.Image}} {{.Config.User}} {{.HostConfig.ReadonlyRootfs}}' hs-container-check > artifacts/container-identity-$editor.txt
            docker logs hs-container-check > artifacts/container-$editor.log 2>&1
            if rg 'MODULE_NOT_FOUND|Cannot find module' artifacts/container-$editor.log; then exit 1; fi
            docker rm --force hs-container-check
          done
          docker image inspect --format '{{.Id}} {{.Size}} {{index .Config.Labels "org.opencontainers.image.revision"}}' holy-sheet-candidate:${{ env.HS_CANDIDATE_SHA }} > artifacts/container-image.txt
      - name: Preserve the exact qualified image for constrained operator rollout
        run: |
          docker save holy-sheet-candidate:${{ env.HS_CANDIDATE_SHA }} | gzip -1 > artifacts/holy-sheet-candidate.tar.gz
          sha256sum artifacts/holy-sheet-candidate.tar.gz > artifacts/holy-sheet-candidate.tar.gz.sha256
      - name: Capture failure logs
        if: failure()
        run: docker logs hs-container-check > artifacts/container-failed.log 2>&1 || true
      - name: Remove isolated test container
        if: always()
        run: docker rm --force hs-container-check || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: holy3-container-${{ env.HS_CANDIDATE_SHA }}
          path: artifacts/
          retention-days: 7

  accessibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:editor
      - name: Real-browser contrast, narrow layout and keyboard regressions
        env:
          PW_CHROMIUM: /usr/bin/google-chrome
        run: npx playwright test -c playwright.accessibility.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editor-accessibility-results
          path: test-results/accessibility/
          retention-days: 7
