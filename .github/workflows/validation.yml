name: Validate Holy Sheet
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  collaboration-experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: experiments/collaboration/package-lock.json
      - run: npm ci --ignore-scripts --prefix experiments/collaboration
      - run: npm test --prefix experiments/collaboration
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-bookworm@sha256:bbf83594798e144bff365a9c191c5d779f181fb3135902064ab8ff11918020fc
        env:
          POSTGRES_DB: holy_sheet_acceptance
          POSTGRES_USER: holy_sheet_acceptance
          POSTGRES_PASSWORD: ephemeral-ci-acceptance-only
        ports:
          - 55493:5432
        options: >-
          --health-cmd "pg_isready -U holy_sheet_acceptance -d holy_sheet_acceptance"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      HS_TEST_POSTGRES_URL: postgresql://holy_sheet_acceptance:ephemeral-ci-acceptance-only@127.0.0.1:55493/holy_sheet_acceptance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test -- --reporter=default --reporter=junit --outputFile.junit=artifacts/unit.xml
      - name: Rehearse synthetic PostgreSQL backup and restore
        run: |
          docker exec ${{ job.services.postgres.id }} pg_dump --username holy_sheet_acceptance --dbname holy_sheet_acceptance --format custom > /tmp/holy-sheet-acceptance.dump
          docker exec ${{ job.services.postgres.id }} createdb --username holy_sheet_acceptance holy_sheet_restore_acceptance
          docker exec -i ${{ job.services.postgres.id }} pg_restore --username holy_sheet_acceptance --dbname holy_sheet_restore_acceptance --no-owner --no-privileges < /tmp/holy-sheet-acceptance.dump
          node --import tsx scripts/verify-postgres-restore.mts > artifacts/postgres-restore.json
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Pack the tested shared editor
        run: npm pack --workspace packages/editor --pack-destination artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-results
          path: |
            artifacts/unit.xml
            artifacts/*.tgz
            artifacts/postgres-restore.json
          if-no-files-found: ignore

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build the actual workspace deployment image
        run: docker build -t holy-sheet-qualification:${{ github.sha }} .
      - name: Verify standalone and embedded routes load from the image
        run: |
          name="holy-sheet-image-${GITHUB_RUN_ID}"
          cleanup() { docker logs "$name" || true; docker rm -f "$name" || true; }
          trap cleanup EXIT
          docker run -d --name "$name" -p 127.0.0.1:3419:3000 \
            -e HS_LOCAL_PREVIEW=0 -e HS_RICH_EDITOR_ENABLED=1 \
            -e HS_IDENTITY_ISSUER=https://accounts.aplyd.org \
            -e HS_IDENTITY_JWKS_URL=https://accounts.aplyd.org/jwks \
            holy-sheet-qualification:${{ github.sha }}
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3419/embed/picker > /tmp/holy-sheet-picker.html; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3419/ > /tmp/holy-sheet-home.html
          curl -fsS http://127.0.0.1:3419/embed/pages/00000000-0000-4000-8000-000000000001 > /tmp/holy-sheet-embed.html
          test "$(curl -s -o /tmp/holy-sheet-denied.json -w '%{http_code}' http://127.0.0.1:3419/api/pages)" = 401
          if docker logs "$name" 2>&1 | rg 'MODULE_NOT_FOUND|Cannot find module'; then exit 1; fi
